<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>B3 用語カード</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+JP:wght@400;500;700&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
a{color:#F5D547}a:hover{color:#FFE680}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; display: flex; flex-direction: column; font-family: 'IBM Plex Sans JP', 'Hiragino Sans', sans-serif; color: #E8ECF3; background: #101828;">
  <header style="display: flex; flex-direction: column; gap: 6px; padding: 12px 12px 0;">
    <div style="height: 4px; margin: 0 4px; border-radius: 999px; background: #344054; overflow: hidden;">
      <div style="width: 8%; height: 100%; background: #F5D547;"></div>
    </div>
    <div style="display: flex; justify-content: space-between; align-items: center;">
      <button aria-label="カードを終了" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; background: transparent; border: 0; color: #B7C0CF;">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
      </button>
      <div style="font-size: 14px; color: #B7C0CF;">用語カード ・ <span style="font-family: 'IBM Plex Mono', 'IBM Plex Sans JP', monospace; color: #E8ECF3; font-weight: 600;">23</span> / 300</div>
      <button aria-label="ひとつ前のカードに戻す" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; background: transparent; border: 0; color: #B7C0CF;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 14L4 9l5-5"></path><path d="M4 9h10a6 6 0 0 1 0 12h-3"></path></svg>
      </button>
    </div>
  </header>

  <main style="flex: 1; position: relative; display: flex; align-items: center; justify-content: center;">
    <div aria-hidden="true" style="position: absolute; left: 6px; top: 50%; transform: translateY(-50%); display: flex; flex-direction: column; align-items: center; gap: 8px; color: #FF8A80;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"></path></svg>
      <span style="writing-mode: vertical-rl; font-size: 14px; font-weight: 700; letter-spacing: 0.2em;">まだ</span>
    </div>
    <div aria-hidden="true" style="position: absolute; right: 6px; top: 50%; transform: translateY(-50%); display: flex; flex-direction: column; align-items: center; gap: 8px; color: #6FD39C;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"></path></svg>
      <span style="writing-mode: vertical-rl; font-size: 14px; font-weight: 700; letter-spacing: 0.2em;">覚えた</span>
    </div>

    <div style="position: relative; width: 300px; height: 470px;">
      <div aria-hidden="true" style="position: absolute; left: 20px; right: 20px; top: 24px; bottom: -24px; border-radius: 20px; background: #161F2E; border: 1px solid #2A3446;"></div>
      <div aria-hidden="true" style="position: absolute; left: 10px; right: 10px; top: 12px; bottom: -12px; border-radius: 20px; background: #1A2333; border: 1px solid #344054;"></div>
      <button aria-label="カードをめくる（表：SQLインジェクション）" style="position: absolute; inset: 0; box-sizing: border-box; display: flex; flex-direction: column; padding: 22px 22px 20px; border-radius: 20px; border: 1px solid #344054; background: #1C2638; color: #E8ECF3; font-family: inherit; text-align: left; box-shadow: 0 16px 36px rgba(0,0,0,0.4);">
        <div style="display: flex; justify-content: space-between; align-items: center; width: 100%;">
          <span style="font-size: 13px; padding: 3px 8px; border-radius: 6px; border: 1px solid #7CC4FA; color: #7CC4FA;">セキュリティ</span>
          <span style="font-size: 13px; color: #B7C0CF;">表</span>
        </div>
        <div style="flex: 1; display: flex; align-items: center; justify-content: center; width: 100%;">
          <span style="font-size: 32px; font-weight: 700; line-height: 1.4; text-align: center; padding: 0 4px; background: linear-gradient(transparent 55%, rgba(245,213,71,0.45) 55%);">SQLインジェクション</span>
        </div>
        <div style="display: flex; flex-direction: column; align-items: center; gap: 8px; width: 100%;">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#B7C0CF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 11V5a1.5 1.5 0 0 1 3 0v5"></path><path d="M12 10V8.5a1.5 1.5 0 0 1 3 0V11"></path><path d="M15 10.5a1.5 1.5 0 0 1 3 0V15a6 6 0 0 1-6 6h-1a6 6 0 0 1-4.6-2.2L4 15.5a1.5 1.5 0 0 1 2.3-1.9L9 16"></path></svg>
          <span style="font-size: 15px; color: #B7C0CF;">タップで意味を見る</span>
          <span style="font-size: 13px; color: #B7C0CF;">次回の復習：<span style="font-family: 'IBM Plex Mono', 'IBM Plex Sans JP', monospace; color: #E8ECF3;">3</span>日後</span>
        </div>
      </button>
    </div>
  </main>

  <footer style="display: flex; flex-direction: column; gap: 10px; padding: 16px 20px 24px;">
    <div style="text-align: center; font-size: 13px; color: #B7C0CF;">左右にスワイプ、またはボタンで仕分け</div>
    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
      <button style="min-height: 56px; display: flex; align-items: center; justify-content: center; gap: 8px; border-radius: 16px; border: 1px solid #FF8A80; background: transparent; color: #FF8A80; font-family: inherit; font-size: 17px; font-weight: 700;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"></path></svg>
        まだ
      </button>
      <button style="min-height: 56px; display: flex; align-items: center; justify-content: center; gap: 8px; border-radius: 16px; border: 0; background: #F5D547; color: #101828; font-family: inherit; font-size: 17px; font-weight: 700;">
        覚えた
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
      </button>
    </div>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
