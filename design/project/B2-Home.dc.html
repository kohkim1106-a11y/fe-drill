<x-dc>
<helmet>

<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; display: flex; flex-direction: column; font-family: 'IBM Plex Sans JP', 'Hiragino Sans', sans-serif; color: #111827; background: #F3F5F9;">
  <div style="flex: 1; display: flex; flex-direction: column; gap: 14px; padding: 22px 16px 14px;">
    <div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 12px;">
      <div style="display: flex; flex-direction: column; gap: 4px;">
        <div style="font-size: 13px; color: #4B5563;">基本情報ドリル</div>
        <div style="font-size: 20px; font-weight: 700; line-height: 1.4; color: #101828;">こんにちは。今日もあと少し。</div>
      </div>
      <div style="display: flex; align-items: center; gap: 6px; padding: 6px 10px; border: 1px solid #D6DCE6; background: #FFFFFF; border-radius: 999px; font-size: 13px; color: #111827; white-space: nowrap;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="#F5D547" stroke="#101828" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3c1 3.5 5 5.5 5 10a5 5 0 0 1-10 0c0-2.5 1.5-3.5 2-5 1 1.5 2 2 3 2-.5-2.5-.5-4.5 0-7z"></path></svg>
        連続 <span style="font-family: 'IBM Plex Mono', 'IBM Plex Sans JP', monospace; font-weight: 600;">7</span>日
      </div>
    </div>

    <div style="display: grid; grid-template-columns: 1.15fr 1fr; gap: 10px;">
      <div style="background: #FFFFFF; border: 1px solid #D6DCE6; border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 6px;">
        <div style="font-size: 13px; color: #4B5563;">試験まで</div>
        <div style="display: flex; align-items: baseline; gap: 4px; color: #101828;">
          <span style="font-family: 'IBM Plex Mono', 'IBM Plex Sans JP', monospace; font-weight: 600; font-size: 40px; line-height: 1; padding: 0 4px; background: linear-gradient(transparent 55%, rgba(245,213,71,0.55) 55%);">52</span>
          <span style="font-size: 16px; font-weight: 700;">日</span>
        </div>
        <div style="font-size: 12px; color: #4B5563;"><span style="font-family: 'IBM Plex Mono', 'IBM Plex Sans JP', monospace;">2026</span>年<span style="font-family: 'IBM Plex Mono', 'IBM Plex Sans JP', monospace;">12</span>月<span style="font-family: 'IBM Plex Mono', 'IBM Plex Sans JP', monospace;">15</span>日</div>
      </div>
      <div style="background: #FFFFFF; border: 1px solid #D6DCE6; border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 8px;">
        <div style="font-size: 13px; color: #4B5563;">今日の目標</div>
        <div style="display: flex; align-items: baseline; gap: 2px;">
          <span style="font-family: 'IBM Plex Mono', 'IBM Plex Sans JP', monospace; font-weight: 600; font-size: 28px; line-height: 1; color: #101828;">12</span>
          <span style="font-family: 'IBM Plex Mono', 'IBM Plex Sans JP', monospace; font-size: 15px; color: #4B5563;">/20</span>
          <span style="font-size: 13px; color: #4B5563; margin-left: 2px;">問</span>
        </div>
        <div style="height: 8px; background: #E4E8EF; border-radius: 999px; overflow: hidden;">
          <div style="width: 60%; height: 100%; background: #101828; border-radius: 999px;"></div>
        </div>
        <div style="font-size: 12px; color: #4B5563;">あと<span style="font-family: 'IBM Plex Mono', 'IBM Plex Sans JP', monospace;">8</span>問で達成</div>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px;">
      <div style="font-size: 14px; font-weight: 700; color: #101828;">分野別に解く</div>
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">
        <button style="min-height: 44px; padding: 0 12px; border-radius: 999px; border: 1px solid #D6DCE6; background: #FFFFFF; color: #111827; font-family: inherit; font-size: 14px;">テクノロジ系</button>
        <button style="min-height: 44px; padding: 0 12px; border-radius: 999px; border: 1px solid #D6DCE6; background: #FFFFFF; color: #111827; font-family: inherit; font-size: 14px;">マネジメント系</button>
        <button style="min-height: 44px; padding: 0 12px; border-radius: 999px; border: 1px solid #D6DCE6; background: #FFFFFF; color: #111827; font-family: inherit; font-size: 14px;">ストラテジ系</button>
        <button style="min-height: 44px; padding: 0 12px; border-radius: 999px; border: 1px solid #D6DCE6; background: #FFFFFF; color: #111827; font-family: inherit; font-size: 14px;">科目B</button>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 6px;">
      <div style="font-size: 14px; font-weight: 700; color: #101828;">クイックスタート</div>
      <div style="background: #FFFFFF; border: 1px solid #D6DCE6; border-radius: 14px; display: flex; flex-direction: column; overflow: hidden;">
        <button style="display: flex; align-items: center; justify-content: space-between; min-height: 44px; padding: 0 14px; background: transparent; border: 0; border-bottom: 1px solid #D6DCE6; color: #111827; font-family: inherit; font-size: 14px; text-align: left;">
          <span>ランダム10問</span>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#4B5563" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
        </button>
        <button style="display: flex; align-items: center; justify-content: space-between; min-height: 44px; padding: 0 14px; background: transparent; border: 0; border-bottom: 1px solid #D6DCE6; color: #111827; font-family: inherit; font-size: 14px; text-align: left;">
          <span>ミニ模試 <span style="font-size: 12px; color: #4B5563;">20問・30分</span></span>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#4B5563" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
        </button>
        <button style="display: flex; align-items: center; justify-content: space-between; min-height: 44px; padding: 0 14px; background: transparent; border: 0; border-bottom: 1px solid #D6DCE6; color: #111827; font-family: inherit; font-size: 14px; text-align: left;">
          <span>科目A 本番形式 <span style="font-size: 12px; color: #4B5563;">60問・90分</span></span>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#4B5563" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
        </button>
        <button style="display: flex; align-items: center; justify-content: space-between; min-height: 44px; padding: 0 14px; background: transparent; border: 0; border-bottom: 1px solid #D6DCE6; color: #111827; font-family: inherit; font-size: 14px; text-align: left;">
          <span>科目B 本番形式 <span style="font-size: 12px; color: #4B5563;">20問・100分</span></span>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#4B5563" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
        </button>
        <button style="display: flex; align-items: center; justify-content: space-between; min-height: 44px; padding: 0 14px; background: transparent; border: 0; color: #111827; font-family: inherit; font-size: 14px; text-align: left;">
          <span>基数変換ドリル</span>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#4B5563" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
        </button>
      </div>
    </div>

    <div style="margin-top: auto; background: #FFFFFF; border: 1px solid #D6DCE6; border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 12px;">
      <div style="display: flex; justify-content: space-between; align-items: baseline;">
        <div style="font-size: 15px; font-weight: 700; color: #101828;">今日の復習</div>
        <div style="font-size: 13px; color: #4B5563;">期限が来た問題 <span style="font-family: 'IBM Plex Mono', 'IBM Plex Sans JP', monospace; font-weight: 600; font-size: 18px; color: #101828; padding: 0 3px; background: linear-gradient(transparent 55%, rgba(245,213,71,0.55) 55%);">8</span>問</div>
      </div>
      <button style="min-height: 52px; border: 1px solid #E0BE2E; border-radius: 14px; background: #F5D547; color: #101828; font-family: inherit; font-size: 16px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px;">
        復習を始める
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#101828" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
      </button>
    </div>
  </div>

  <nav style="display: grid; grid-template-columns: repeat(4, 1fr); border-top: 1px solid #D6DCE6; background: #FFFFFF; padding: 6px 4px 14px;">
    <button aria-current="page" style="min-height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; background: transparent; border: 0; color: #101828; font-family: inherit; font-size: 11px; font-weight: 700;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7"></path><path d="M5 10v10h14V10"></path></svg>
      <span style="padding: 0 4px; background: linear-gradient(transparent 55%, rgba(245,213,71,0.55) 55%);">ホーム</span>
    </button>
    <button style="min-height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; background: transparent; border: 0; color: #4B5563; font-family: inherit; font-size: 11px;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"></path><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"></path></svg>

    <button style="min-height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; background: transparent; border: 0; color: #4B5563; font-family: inherit; font-size: 11px;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="6" width="14" height="14" rx="2"></rect><path d="M7 3h12a2 2 0 0 1 2 2v12"></path></svg>
      カード

    <button style="min-height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; background: transparent; border: 0; color: #4B5563; font-family: inherit; font-size: 11px;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"></path></svg>
      分析

  </nav>
</div>
