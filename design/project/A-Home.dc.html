<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>A ホーム</title>

</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&amp;family=M+PLUS+1+Code:wght@500;600&amp;family=Dela+Gothic+One&amp;display=swap">
<style>
body{margin:0}
a{color:#C9295F}a:hover{color:#8E1A42}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; overflow: hidden; font-family: 'Zen Kaku Gothic New', 'Hiragino Sans', sans-serif; color: #1D2228; background: #F6F7F9;">
  <header style="height: 56px; flex-shrink: 0; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; border-bottom: 1px solid #E3D3DA; background: #FFFFFF;">
    <div style="display: flex; align-items: center; gap: 8px;">
      <div style="width: 14px; height: 20px; border-radius: 7px; background: #C9295F;"></div>
      <div style="font-family: 'Dela Gothic One', 'Zen Kaku Gothic New', sans-serif; font-size: 20px; letter-spacing: 0.02em;">基本情報ドリル</div>
    </div>
    <button aria-label="設定" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border: none; background: transparent; color: #5B626C; cursor: pointer;">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"></path></svg>
    </button>
  </header>

  <main style="flex: 1; display: flex; flex-direction: column; gap: 14px; padding: 14px 16px 12px; overflow: hidden;">
    <section style="position: relative; display: flex; flex-direction: column; gap: 12px; padding: 14px 16px 14px 28px; background: #FFFFFF; border: 1px solid #E3D3DA; border-radius: 12px;">
      <div aria-hidden="true" style="position: absolute; left: 10px; top: 14px; bottom: 14px; display: flex; flex-direction: column; justify-content: space-between;">
        <div style="width: 8px; height: 3px; background: #1D2228;"></div>
        <div style="width: 8px; height: 3px; background: #1D2228;"></div>
        <div style="width: 8px; height: 3px; background: #1D2228;"></div>
        <div style="width: 8px; height: 3px; background: #1D2228;"></div>
        <div style="width: 8px; height: 3px; background: #1D2228;"></div>
        <div style="width: 8px; height: 3px; background: #1D2228;"></div>
        <div style="width: 8px; height: 3px; background: #1D2228;"></div>
      </div>
      <div style="display: flex; align-items: flex-end; justify-content: space-between;">
        <div style="display: flex; flex-direction: column; gap: 2px;">
          <div style="font-size: 13px; color: #5B626C; font-weight: 500;">試験まで</div>
          <div style="display: flex; align-items: baseline; gap: 4px;">
            <span style="font-family: 'Dela Gothic One', sans-serif; font-size: 44px; line-height: 1; color: #C9295F;">52</span>
            <span style="font-size: 16px; font-weight: 700;">日</span>
          </div>
        </div>
        <div style="text-align: right; font-size: 13px; color: #5B626C;">
          <div>試験日</div>
          <div style="font-family: 'M PLUS 1 Code', monospace; font-weight: 600; font-size: 14px; color: #1D2228;">2026年12月15日</div>
        </div>
      </div>
      <div style="height: 1px; background: #E3D3DA;"></div>
      <div style="display: flex; flex-direction: column; gap: 6px;">
        <div style="display: flex; justify-content: space-between; align-items: baseline;">
          <span style="font-size: 14px; font-weight: 700;">今日の目標</span>
          <span style="font-family: 'M PLUS 1 Code', monospace; font-size: 14px; font-weight: 600;">12<span style="color: #5B626C;"> / 20問</span></span>
        </div>
        <div style="display: grid; grid-template-columns: repeat(20, 1fr); gap: 3px;" aria-hidden="true">
          <div style="height: 10px; border-radius: 5px; background: #C9295F;"></div>
          <div style="height: 10px; border-radius: 5px; background: #C9295F;"></div>
          <div style="height: 10px; border-radius: 5px; background: #C9295F;"></div>
          <div style="height: 10px; border-radius: 5px; background: #C9295F;"></div>
          <div style="height: 10px; border-radius: 5px; background: #C9295F;"></div>
          <div style="height: 10px; border-radius: 5px; background: #C9295F;"></div>
          <div style="height: 10px; border-radius: 5px; background: #C9295F;"></div>
          <div style="height: 10px; border-radius: 5px; background: #C9295F;"></div>
          <div style="height: 10px; border-radius: 5px; background: #C9295F;"></div>
          <div style="height: 10px; border-radius: 5px; background: #C9295F;"></div>
          <div style="height: 10px; border-radius: 5px; background: #C9295F;"></div>
          <div style="height: 10px; border-radius: 5px; background: #C9295F;"></div>
          <div style="height: 10px; border-radius: 5px; border: 1.5px solid #C9295F; box-sizing: border-box;"></div>
          <div style="height: 10px; border-radius: 5px; border: 1.5px solid #C9295F; box-sizing: border-box;"></div>
          <div style="height: 10px; border-radius: 5px; border: 1.5px solid #C9295F; box-sizing: border-box;"></div>
          <div style="height: 10px; border-radius: 5px; border: 1.5px solid #C9295F; box-sizing: border-box;"></div>
          <div style="height: 10px; border-radius: 5px; border: 1.5px solid #C9295F; box-sizing: border-box;"></div>
          <div style="height: 10px; border-radius: 5px; border: 1.5px solid #C9295F; box-sizing: border-box;"></div>
          <div style="height: 10px; border-radius: 5px; border: 1.5px solid #C9295F; box-sizing: border-box;"></div>
          <div style="height: 10px; border-radius: 5px; border: 1.5px solid #C9295F; box-sizing: border-box;"></div>
        </div>
        <div style="font-size: 12px; color: #5B626C;">あと8問で今日の目標達成</div>
      </div>
    </section>

    <section style="display: flex; flex-direction: column; gap: 8px;">
      <h2 style="margin: 0; font-size: 15px; font-weight: 700;">すぐに始める</h2>
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">
        <button style="min-height: 60px; display: flex; flex-direction: column; align-items: flex-start; justify-content: center; gap: 2px; padding: 8px 12px; border: 1px solid #E3D3DA; border-radius: 10px; background: #FFFFFF; font-family: inherit; color: #1D2228; text-align: left; cursor: pointer;">
          <span style="font-size: 15px; font-weight: 700;">ランダム10問</span>
          <span style="font-size: 12px; color: #5B626C;">全分野から出題</span>
        </button>
        <button style="min-height: 60px; display: flex; flex-direction: column; align-items: flex-start; justify-content: center; gap: 2px; padding: 8px 12px; border: 1px solid #E3D3DA; border-radius: 10px; background: #FFFFFF; font-family: inherit; color: #1D2228; text-align: left; cursor: pointer;">
          <span style="font-size: 15px; font-weight: 700;">ミニ模試</span>
          <span style="font-family: 'M PLUS 1 Code', monospace; font-size: 12px; color: #5B626C;">20問・30分</span>
        </button>
        <button style="min-height: 60px; display: flex; flex-direction: column; align-items: flex-start; justify-content: center; gap: 2px; padding: 8px 12px; border: 1px solid #E3D3DA; border-radius: 10px; background: #FFFFFF; font-family: inherit; color: #1D2228; text-align: left; cursor: pointer;">
          <span style="font-size: 15px; font-weight: 700;">科目A 本番形式</span>
          <span style="font-family: 'M PLUS 1 Code', monospace; font-size: 12px; color: #5B626C;">60問・90分</span>
        </button>
        <button style="min-height: 60px; display: flex; flex-direction: column; align-items: flex-start; justify-content: center; gap: 2px; padding: 8px 12px; border: 1px solid #E3D3DA; border-radius: 10px; background: #FFFFFF; font-family: inherit; color: #1D2228; text-align: left; cursor: pointer;">
          <span style="font-size: 15px; font-weight: 700;">科目B 本番形式</span>
          <span style="font-family: 'M PLUS 1 Code', monospace; font-size: 12px; color: #5B626C;">20問・100分</span>
        </button>
        <button style="grid-column: 1 / span 2; min-height: 48px; display: flex; align-items: center; justify-content: space-between; padding: 8px 12px; border: 1px solid #E3D3DA; border-radius: 10px; background: #FFFFFF; font-family: inherit; color: #1D2228; text-align: left; cursor: pointer;">
          <span style="font-size: 15px; font-weight: 700;">基数変換ドリル</span>
          <span style="font-family: 'M PLUS 1 Code', monospace; font-size: 12px; color: #5B626C;">2進 ⇄ 10進 ⇄ 16進</span>
        </button>
      </div>
    </section>

    <section style="display: flex; flex-direction: column; gap: 8px;">
      <h2 style="margin: 0; font-size: 15px; font-weight: 700;">分野別に解く</h2>
      <div style="display: flex; flex-wrap: wrap; gap: 8px;">
        <button style="min-height: 44px; padding: 0 14px; border: 1.5px solid #C9295F; border-radius: 22px; background: #FFFFFF; font-family: inherit; font-size: 14px; font-weight: 500; color: #1D2228; cursor: pointer;">テクノロジ系</button>
        <button style="min-height: 44px; padding: 0 14px; border: 1.5px solid #C9295F; border-radius: 22px; background: #FFFFFF; font-family: inherit; font-size: 14px; font-weight: 500; color: #1D2228; cursor: pointer;">マネジメント系</button>
        <button style="min-height: 44px; padding: 0 14px; border: 1.5px solid #C9295F; border-radius: 22px; background: #FFFFFF; font-family: inherit; font-size: 14px; font-weight: 500; color: #1D2228; cursor: pointer;">ストラテジ系</button>
        <button style="min-height: 44px; padding: 0 14px; border: 1.5px solid #C9295F; border-radius: 22px; background: #FFFFFF; font-family: inherit; font-size: 14px; font-weight: 500; color: #1D2228; cursor: pointer;">科目B</button>
      </div>
    </section>

    <section style="margin-top: auto; display: flex; flex-direction: column; gap: 10px; padding: 14px 16px; background: #FBE7EE; border-radius: 12px;">
      <div style="display: flex; align-items: center; justify-content: space-between;">
        <div style="display: flex; flex-direction: column; gap: 2px;">
          <span style="font-size: 15px; font-weight: 700;">今日の復習</span>
          <span style="font-size: 12px; color: #5B626C;">間違えた問題・期限が来た問題</span>
        </div>
        <div style="display: flex; align-items: baseline; gap: 2px;">
          <span style="font-family: 'M PLUS 1 Code', monospace; font-size: 30px; font-weight: 600; color: #C9295F; line-height: 1;">8</span>
          <span style="font-size: 14px; font-weight: 700;">問</span>
        </div>
      </div>
      <button style="height: 52px; border: none; border-radius: 26px; background: #C9295F; color: #FFFFFF; font-family: inherit; font-size: 17px; font-weight: 700; cursor: pointer;">復習を始める</button>
    </section>
  </main>

  <nav aria-label="メイン" style="flex-shrink: 0; display: flex; border-top: 1px solid #E3D3DA; background: #FFFFFF; padding-bottom: 8px;">
    <button aria-current="page" style="flex: 1; min-height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; border: none; background: transparent; font-family: inherit; font-size: 11px; font-weight: 700; color: #C9295F; cursor: pointer;">
      <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"></path><path d="M5 9.5V20h5v-6h4v6h5V9.5"></path></svg>
      ホーム
    </button>
    <button style="flex: 1; min-height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; border: none; background: transparent; font-family: inherit; font-size: 11px; font-weight: 500; color: #5B626C; cursor: pointer;">
      <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="7" cy="8" rx="2.5" ry="3.5"></ellipse><ellipse cx="17" cy="8" rx="2.5" ry="3.5"></ellipse><path d="M4 16h16"></path><path d="M4 20h10"></path></svg>
      演習

    <button style="flex: 1; min-height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; border: none; background: transparent; font-family: inherit; font-size: 11px; font-weight: 500; color: #5B626C; cursor: pointer;">
      <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="3" width="14" height="16" rx="2"></rect><path d="M4 7v12a2 2 0 0 0 2 2h10"></path></svg>
      カード

    <button style="flex: 1; min-height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; border: none; background: transparent; font-family: inherit; font-size: 11px; font-weight: 500; color: #5B626C; cursor: pointer;">
      <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h16"></path><path d="M7 16V10"></path><path d="M12 16V5"></path><path d="M17 16v-4"></path></svg>

</div>
