<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>A 用語カード</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&amp;family=M+PLUS+1+Code:wght@500;600&amp;family=Dela+Gothic+One&amp;display=swap">
<style>
body{margin:0}
a{color:#C9295F}a:hover{color:#8E1A42}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; overflow: hidden; font-family: 'Zen Kaku Gothic New', 'Hiragino Sans', sans-serif; color: #1D2228; background: #F6F7F9;">
  <header style="height: 56px; flex-shrink: 0; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; background: #FFFFFF; border-bottom: 1px solid #E3D3DA;">
    <h1 style="margin: 0; font-size: 18px; font-weight: 700;">用語カード</h1>
    <div style="font-family: 'M PLUS 1 Code', monospace; font-size: 15px; font-weight: 600;">23<span style="color: #5B626C;"> / 300</span></div>
  </header>

  <main style="flex: 1; display: flex; flex-direction: column; gap: 14px; padding: 12px 16px; overflow: hidden;">
    <div style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px;">
      <button aria-pressed="true" style="min-height: 44px; padding: 0 4px; border: 1.5px solid #C9295F; border-radius: 22px; background: #C9295F; font-family: inherit; font-size: 13px; font-weight: 700; color: #FFFFFF; cursor: pointer;">すべて</button>
      <button aria-pressed="false" style="min-height: 44px; padding: 0 4px; border: 1.5px solid #C9295F; border-radius: 22px; background: #FFFFFF; font-family: inherit; font-size: 13px; font-weight: 500; color: #1D2228; cursor: pointer;">テクノロジ</button>
      <button aria-pressed="false" style="min-height: 44px; padding: 0 4px; border: 1.5px solid #C9295F; border-radius: 22px; background: #FFFFFF; font-family: inherit; font-size: 13px; font-weight: 500; color: #1D2228; cursor: pointer;">マネジメント</button>
      <button aria-pressed="false" style="min-height: 44px; padding: 0 4px; border: 1.5px solid #C9295F; border-radius: 22px; background: #FFFFFF; font-family: inherit; font-size: 13px; font-weight: 500; color: #1D2228; cursor: pointer;">ストラテジ</button>
    </div>

    <div aria-hidden="true" style="height: 4px; border-radius: 2px; background: #E3D3DA; overflow: hidden;">
      <div style="width: 7.7%; height: 4px; background: #C9295F;"></div>
    </div>

    <button aria-label="カードをめくる（MTBF）" style="position: relative; flex: 1; display: flex; flex-direction: column; padding: 0; border: 1px solid #E3D3DA; border-radius: 16px; background: #FFFFFF; font-family: inherit; color: #1D2228; text-align: left; cursor: pointer; overflow: hidden;">
      <div aria-hidden="true" style="position: absolute; left: 12px; top: 20px; bottom: 20px; display: flex; flex-direction: column; justify-content: space-between;">
        <div style="width: 8px; height: 3px; background: #1D2228;"></div>
        <div style="width: 8px; height: 3px; background: #1D2228;"></div>
        <div style="width: 8px; height: 3px; background: #1D2228;"></div>
        <div style="width: 8px; height: 3px; background: #1D2228;"></div>
        <div style="width: 8px; height: 3px; background: #1D2228;"></div>
        <div style="width: 8px; height: 3px; background: #1D2228;"></div>
        <div style="width: 8px; height: 3px; background: #1D2228;"></div>
        <div style="width: 8px; height: 3px; background: #1D2228;"></div>
        <div style="width: 8px; height: 3px; background: #1D2228;"></div>
        <div style="width: 8px; height: 3px; background: #1D2228;"></div>
        <div style="width: 8px; height: 3px; background: #1D2228;"></div>
        <div style="width: 8px; height: 3px; background: #1D2228;"></div>
        <div style="width: 8px; height: 3px; background: #1D2228;"></div>
        <div style="width: 8px; height: 3px; background: #1D2228;"></div>
        <div style="width: 8px; height: 3px; background: #1D2228;"></div>
        <div style="width: 8px; height: 3px; background: #1D2228;"></div>
      </div>
      <div style="width: 100%; box-sizing: border-box; flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 20px 20px 20px 36px;">
        <span style="padding: 2px 10px; border-radius: 4px; background: #FBE7EE; font-size: 12px; font-weight: 500; color: #8E1A42;">テクノロジ系 ・ システム構成</span>
        <span style="font-family: 'M PLUS 1 Code', monospace; font-size: 48px; font-weight: 600; letter-spacing: 0.04em;">MTBF</span>
        <span style="font-size: 13px; color: #5B626C;">Mean Time Between Failures</span>
      </div>
      <div aria-hidden="true" style="width: 100%; box-sizing: border-box; display: flex; align-items: center; gap: 8px; padding: 0 20px 0 36px;">
        <div style="flex: 1; height: 0; border-top: 1.5px dashed #E3D3DA;"></div>
        <span style="font-size: 11px; font-weight: 700; color: #8E1A42;">うら</span>
        <div style="flex: 1; height: 0; border-top: 1.5px dashed #E3D3DA;"></div>
      </div>
      <div style="width: 100%; box-sizing: border-box; display: flex; flex-direction: column; gap: 10px; padding: 16px 20px 22px 36px;">
        <span style="font-size: 18px; font-weight: 700;">平均故障間隔</span>
        <span style="font-size: 15px; line-height: 1.7;">故障が直ってから次に故障するまでの平均時間。</span>
        <span style="padding: 8px 10px; border-radius: 6px; background: #F6F7F9; font-family: 'M PLUS 1 Code', monospace; font-size: 14px; font-weight: 600; line-height: 1.5;">稼働率 = MTBF ÷ (MTBF + MTTR)</span>
      </div>
    </button>

    <div style="display: flex; align-items: center; justify-content: space-between; font-size: 13px; color: #5B626C;">
      <span style="display: flex; align-items: center; gap: 4px;">
        <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 0 1 14-5.3L20 9"></path><path d="M20 4v5h-5"></path><path d="M20 12a8 8 0 0 1-14 5.3L4 15"></path><path d="M4 20v-5h5"></path></svg>
        タップでめくる
      </span>
      <span>次回: <span style="font-family: 'M PLUS 1 Code', monospace; font-weight: 600; color: #1D2228;">3日後</span></span>
    </div>

    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
      <button style="height: 56px; display: flex; align-items: center; justify-content: center; gap: 6px; border: 1.5px solid #C9295F; border-radius: 28px; background: #FFFFFF; font-family: inherit; font-size: 17px; font-weight: 700; color: #C9295F; cursor: pointer;">
        <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"></path><path d="M4 9h11a5 5 0 0 1 0 10h-3"></path></svg>
        まだ
      </button>
      <button style="height: 56px; display: flex; align-items: center; justify-content: center; gap: 6px; border: none; border-radius: 28px; background: #C9295F; font-family: inherit; font-size: 17px; font-weight: 700; color: #FFFFFF; cursor: pointer;">
        <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5 10 17l9-10"></path></svg>
        覚えた
      </button>
    </div>
  </main>

  <nav aria-label="メイン" style="flex-shrink: 0; display: flex; border-top: 1px solid #E3D3DA; background: #FFFFFF; padding-bottom: 8px;">
    <button style="flex: 1; min-height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; border: none; background: transparent; font-family: inherit; font-size: 11px; font-weight: 500; color: #5B626C; cursor: pointer;">
      <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"></path><path d="M5 9.5V20h5v-6h4v6h5V9.5"></path></svg>
      ホーム
    </button>
    <button style="flex: 1; min-height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; border: none; background: transparent; font-family: inherit; font-size: 11px; font-weight: 500; color: #5B626C; cursor: pointer;">
      <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="7" cy="8" rx="2.5" ry="3.5"></ellipse><ellipse cx="17" cy="8" rx="2.5" ry="3.5"></ellipse><path d="M4 16h16"></path><path d="M4 20h10"></path></svg>
      演習
    </button>
    <button aria-current="page" style="flex: 1; min-height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; border: none; background: transparent; font-family: inherit; font-size: 11px; font-weight: 700; color: #C9295F; cursor: pointer;">
      <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="3" width="14" height="16" rx="2"></rect><path d="M4 7v12a2 2 0 0 0 2 2h10"></path></svg>
      カード
    </button>
    <button style="flex: 1; min-height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; border: none; background: transparent; font-family: inherit; font-size: 11px; font-weight: 500; color: #5B626C; cursor: pointer;">
      <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h16"></path><path d="M7 16V10"></path><path d="M12 16V5"></path><path d="M17 16v-4"></path></svg>
      分析
    </button>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
