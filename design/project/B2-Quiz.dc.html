<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>B2 演習</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+JP:wght@400;500;700&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
a{color:#1F6FB2}a:hover{color:#174F80}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; display: flex; flex-direction: column; font-family: 'IBM Plex Sans JP', 'Hiragino Sans', sans-serif; color: #111827; background: #F3F5F9;">
  <header style="display: flex; flex-direction: column; gap: 8px; padding: 10px 8px 0;">
    <div style="display: grid; grid-template-columns: 76px 1fr 76px; align-items: center;">
      <button style="min-height: 44px; display: flex; align-items: center; gap: 4px; padding: 0 8px; background: transparent; border: 0; color: #4B5563; font-family: inherit; font-size: 14px;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
        終了
      </button>
      <div style="text-align: center; font-size: 15px; font-weight: 700; color: #101828;">科目B 擬似言語</div>
      <div style="text-align: right; padding-right: 10px; font-family: 'IBM Plex Mono', 'IBM Plex Sans JP', monospace; font-size: 14px; color: #4B5563;"><span style="color: #101828; font-weight: 600;">2</span>/10</div>
    </div>
    <div style="margin: 0 8px; height: 4px; background: #E4E8EF; border-radius: 999px; overflow: hidden;">
      <div style="width: 20%; height: 100%; background: #101828;"></div>
    </div>
  </header>

  <main style="flex: 1; display: flex; flex-direction: column; gap: 12px; padding: 14px 16px 0;">
    <div style="display: flex; align-items: center; gap: 8px;">
      <span style="font-size: 15px; font-weight: 700; color: #101828;">問<span style="font-family: 'IBM Plex Mono', 'IBM Plex Sans JP', monospace;">2</span></span>
      <span style="font-size: 12px; padding: 3px 8px; border-radius: 6px; border: 1px solid #1F6FB2; color: #1F6FB2; background: #FFFFFF;">科目B</span>
      <span style="font-size: 12px; padding: 3px 8px; border-radius: 6px; background: #E4E8EF; color: #4B5563;">再帰</span>
    </div>
    <p style="margin: 0; font-size: 16px; line-height: 1.7;">次の関数 <span style="font-family: 'IBM Plex Mono', 'IBM Plex Sans JP', monospace;">f</span> について、<span style="font-family: 'IBM Plex Mono', 'IBM Plex Sans JP', monospace;">f(4)</span> の戻り値はどれか。</p>
    <pre style="margin: 0; padding: 12px 14px; background: #FFFFFF; border: 1px solid #D6DCE6; border-radius: 14px; font-family: 'IBM Plex Mono', 'IBM Plex Sans JP', monospace; font-size: 13.5px; line-height: 1.7; color: #111827; white-space: pre; overflow-x: auto;">○整数型: f(整数型: n)
  <span style="color: #1F6FB2; font-weight: 600;">if</span> (n ≦ 1)
    <span style="color: #1F6FB2; font-weight: 600;">return</span> 1
  <span style="color: #1F6FB2; font-weight: 600;">endif</span>
  <span style="color: #1F6FB2; font-weight: 600;">return</span> n × f(n − 1)</pre>

    <div style="display: flex; flex-direction: column; gap: 8px;">
      <button aria-pressed="true" style="min-height: 48px; display: flex; align-items: center; gap: 12px; padding: 0 12px; border-radius: 14px; border: 2px solid #1E7A47; background: #FFFFFF; color: #111827; font-family: inherit; font-size: 16px; text-align: left;">
        <span style="width: 30px; height: 30px; border-radius: 8px; display: flex; align-items: center; justify-content: center; background: #F5D547; color: #101828; font-weight: 700; font-size: 14px;">ア</span>
        <span style="flex: 1; font-family: 'IBM Plex Mono', 'IBM Plex Sans JP', monospace; font-weight: 600;">24</span>
        <span style="display: flex; align-items: center; gap: 4px; font-size: 13px; color: #1E7A47; font-weight: 700;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg>
          あなたの解答
        </span>
      </button>
      <button style="min-height: 48px; display: flex; align-items: center; gap: 12px; padding: 0 12px; border-radius: 14px; border: 1px solid #D6DCE6; background: #FFFFFF; color: #4B5563; font-family: inherit; font-size: 16px; text-align: left;">
        <span style="width: 30px; height: 30px; border-radius: 8px; display: flex; align-items: center; justify-content: center; border: 1px solid #D6DCE6; color: #4B5563; font-size: 14px;">イ</span>
        <span style="font-family: 'IBM Plex Mono', 'IBM Plex Sans JP', monospace;">10</span>
      </button>
      <button style="min-height: 48px; display: flex; align-items: center; gap: 12px; padding: 0 12px; border-radius: 14px; border: 1px solid #D6DCE6; background: #FFFFFF; color: #4B5563; font-family: inherit; font-size: 16px; text-align: left;">
        <span style="width: 30px; height: 30px; border-radius: 8px; display: flex; align-items: center; justify-content: center; border: 1px solid #D6DCE6; color: #4B5563; font-size: 14px;">ウ</span>
        <span style="font-family: 'IBM Plex Mono', 'IBM Plex Sans JP', monospace;">12</span>
      </button>
      <button style="min-height: 48px; display: flex; align-items: center; gap: 12px; padding: 0 12px; border-radius: 14px; border: 1px solid #D6DCE6; background: #FFFFFF; color: #4B5563; font-family: inherit; font-size: 16px; text-align: left;">
        <span style="width: 30px; height: 30px; border-radius: 8px; display: flex; align-items: center; justify-content: center; border: 1px solid #D6DCE6; color: #4B5563; font-size: 14px;">エ</span>
        <span style="font-family: 'IBM Plex Mono', 'IBM Plex Sans JP', monospace;">4</span>
      </button>
    </div>

    <section style="background: #FFFFFF; border: 1px solid #D6DCE6; border-radius: 14px; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px;">
      <div style="display: flex; justify-content: space-between; align-items: center;">
        <div style="font-size: 17px; font-weight: 700; color: #1E7A47;">○ 正解</div>
        <div style="font-size: 12px; color: #4B5563;">出典：オリジナル問題</div>
      </div>
      <div style="font-size: 13px; color: #4B5563;">解説</div>
      <p style="margin: 0; font-size: 15px; line-height: 1.7;"><span style="font-family: 'IBM Plex Mono', 'IBM Plex Sans JP', monospace; padding: 0 2px; background: linear-gradient(transparent 55%, rgba(245,213,71,0.55) 55%);">f(4) = 4 × 3 × 2 × 1 = 24</span>（階乗）。<span style="font-family: 'IBM Plex Mono', 'IBM Plex Sans JP', monospace;">n ≦ 1</span> で <span style="font-family: 'IBM Plex Mono', 'IBM Plex Sans JP', monospace;">1</span> を返して再帰が止まる。</p>
    </section>
  </main>

  <footer style="display: flex; align-items: center; gap: 10px; padding: 12px 16px 22px;">
    <button style="min-height: 48px; padding: 0 12px; display: flex; align-items: center; gap: 6px; background: transparent; border: 0; color: #4B5563; font-family: inherit; font-size: 13px;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 21V4h11l-1.5 4L16 12H5"></path></svg>
      誤りを報告
    </button>
    <button style="flex: 1; min-height: 52px; border: 1px solid #E0BE2E; border-radius: 14px; background: #F5D547; color: #101828; font-family: inherit; font-size: 16px; font-weight: 700;">次の問題 →</button>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>

  renderVals() { return {}; }
}
</script>
</body>
</html>
