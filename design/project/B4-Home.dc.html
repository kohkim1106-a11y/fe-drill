<html lang="ja">
<head>
<meta charset="utf-8">

<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+JP:wght@400;500;700&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
a{color:#F5D547}a:hover{color:#FFE680}
</style>

<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; display: flex; flex-direction: column; font-family: 'IBM Plex Sans JP', 'Hiragino Sans', sans-serif; color: #E8ECF3; background: #101828;">
  <div style="flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 12px; padding: 20px 16px 14px;">
    <div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 12px;">
      <div style="display: flex; flex-direction: column; gap: 4px;">
        <div style="font-size: 13px; color: #B7C0CF;">基本情報ドリル</div>
        <div style="font-size: 20px; font-weight: 700; line-height: 1.4;">今日の分を、静かに。</div>
      </div>
      <div style="display: flex; flex-direction: column; align-items: flex-end; gap: 2px; padding: 6px 12px; border: 1px solid #344054; border-radius: 12px; white-space: nowrap;">
        <span style="font-size: 11px; color: #B7C0CF;">試験まで</span>
        <span style="font-size: 13px;"><span style="font-family: 'IBM Plex Mono', 'IBM Plex Sans JP', monospace; font-weight: 600; font-size: 20px; padding: 0 2px; background: linear-gradient(transparent 55%, rgba(245,213,71,0.45) 55%);">52</span>日</span>
      </div>
    </div>

    <section style="background: #1C2638; border: 1px solid #344054; border-radius: 14px; padding: 12px 14px; display: flex; flex-direction: column; gap: 10px;">
      <div style="display: flex; justify-content: space-between; align-items: baseline;">
        <div style="display: flex; align-items: baseline; gap: 6px;">
          <span style="font-size: 14px; font-weight: 700;">連続学習</span>
          <span style="font-family: 'IBM Plex Mono', 'IBM Plex Sans JP', monospace; font-weight: 600; font-size: 24px; line-height: 1;">7</span>
          <span style="font-size: 14px;">日</span>
        </div>
        <span style="font-size: 12px; color: #B7C0CF;">最長 <span style="font-family: 'IBM Plex Mono', 'IBM Plex Sans JP', monospace; color: #E8ECF3;">12</span>日</span>
      </div>
      <div style="display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; text-align: center;">
        <div style="display: flex; flex-direction: column; align-items: center; gap: 4px;">
          <span style="font-size: 11px; color: #B7C0CF;">日</span>
          <span style="width: 30px; height: 30px; border-radius: 999px; background: #F5D547; display: flex; align-items: center; justify-content: center;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#101828" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg></span>
          <span style="font-family: 'IBM Plex Mono', 'IBM Plex Sans JP', monospace; font-size: 11px; color: #B7C0CF;">18</span>
        </div>
        <div style="display: flex; flex-direction: column; align-items: center; gap: 4px;">
          <span style="font-size: 11px; color: #B7C0CF;">月</span>
          <span style="width: 30px; height: 30px; border-radius: 999px; background: #F5D547; display: flex; align-items: center; justify-content: center;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#101828" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg></span>
          <span style="font-family: 'IBM Plex Mono', 'IBM Plex Sans JP', monospace; font-size: 11px; color: #B7C0CF;">19</span>
        </div>
        <div style="display: flex; flex-direction: column; align-items: center; gap: 4px;">
          <span style="font-size: 11px; color: #B7C0CF;">火</span>
          <span style="width: 30px; height: 30px; border-radius: 999px; background: #F5D547; display: flex; align-items: center; justify-content: center;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#101828" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg></span>
          <span style="font-family: 'IBM Plex Mono', 'IBM Plex Sans JP', monospace; font-size: 11px; color: #B7C0CF;">20</span>
        </div>
        <div style="display: flex; flex-direction: column; align-items: center; gap: 4px;">
          <span style="font-size: 11px; color: #B7C0CF;">水</span>
          <span style="width: 30px; height: 30px; border-radius: 999px; background: #F5D547; display: flex; align-items: center; justify-content: center;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#101828" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg></span>
          <span style="font-family: 'IBM Plex Mono', 'IBM Plex Sans JP', monospace; font-size: 11px; color: #B7C0CF;">21</span>
        </div>
        <div style="display: flex; flex-direction: column; align-items: center; gap: 4px;">
          <span style="font-size: 11px; color: #B7C0CF;">木</span>
          <span style="width: 30px; height: 30px; border-radius: 999px; background: #F5D547; display: flex; align-items: center; justify-content: center;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#101828" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg></span>
          <span style="font-family: 'IBM Plex Mono', 'IBM Plex Sans JP', monospace; font-size: 11px; color: #B7C0CF;">22</span>
        </div>
        <div style="display: flex; flex-direction: column; align-items: center; gap: 4px;">
          <span style="font-size: 11px; color: #B7C0CF;">金</span>
          <span style="width: 30px; height: 30px; border-radius: 999px; background: #F5D547; display: flex; align-items: center; justify-content: center;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#101828" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg></span>
          <span style="font-family: 'IBM Plex Mono', 'IBM Plex Sans JP', monospace; font-size: 11px; color: #B7C0CF;">23</span>
        </div>
        <div style="display: flex; flex-direction: column; align-items: center; gap: 4px;">
          <span style="font-size: 11px; color: #F5D547; font-weight: 700;">今日</span>
          <span style="width: 30px; height: 30px; box-sizing: border-box; border-radius: 999px; border: 2px solid #F5D547; box-shadow: 0 0 0 3px #1C2638, 0 0 0 4px #E8ECF3; display: flex; align-items: center; justify-content: center;"><span style="width: 14px; height: 14px; border-radius: 999px; background: #F5D547;"></span></span>
          <span style="font-family: 'IBM Plex Mono', 'IBM Plex Sans JP', monospace; font-size: 11px; color: #F5D547; font-weight: 600;">24</span>
        </div>
      </div>
      <div style="font-size: 12px; color: #B7C0CF;">今日の分は記録済み。ミッションを終えると印が塗りつぶされます。</div>
    </section>

    <section style="background: #1C2638; border: 1px solid #344054; border-radius: 14px; padding: 12px 14px 6px; display: flex; flex-direction: column; gap: 8px;">
      <div style="display: flex; justify-content: space-between; align-items: baseline;">
        <h2 style="margin: 0; font-size: 15px; font-weight: 700;">今日のミッション</h2>
        <span style="font-family: 'IBM Plex Mono', 'IBM Plex Sans JP', monospace; font-size: 14px; color: #B7C0CF;"><span style="color: #E8ECF3; font-weight: 600; font-size: 18px;">1</span>/3</span>
      </div>
      <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px;">
        <div style="height: 6px; border-radius: 999px; background: #F5D547;"></div>
        <div style="height: 6px; border-radius: 999px; background: #344054;"></div>
        <div style="height: 6px; border-radius: 999px; background: #344054;"></div>
      </div>
      <div style="display: flex; flex-direction: column;">
        <button aria-pressed="true" style="min-height: 48px; display: flex; align-items: center; gap: 12px; padding: 0; background: transparent; border: 0; border-bottom: 1px solid #344054; color: #B7C0CF; font-family: inherit; font-size: 15px; text-align: left;">
          <span style="width: 24px; height: 24px; border-radius: 7px; background: #6FD39C; display: flex; align-items: center; justify-content: center; flex: none;"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#101828" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg></span>
          <span style="flex: 1;">復習<span style="font-family: 'IBM Plex Mono', 'IBM Plex Sans JP', monospace;">8</span>問を解く</span>
          <span style="font-size: 12px; color: #6FD39C;">完了</span>
        </button>
        <button style="min-height: 48px; display: flex; align-items: center; gap: 12px; padding: 0; background: transparent; border: 0; border-bottom: 1px solid #344054; color: #E8ECF3; font-family: inherit; font-size: 15px; text-align: left;">
          <span style="width: 24px; height: 24px; box-sizing: border-box; border-radius: 7px; border: 2px solid #B7C0CF; flex: none;"></span>
          <span style="flex: 1;">新しい問題<span style="font-family: 'IBM Plex Mono', 'IBM Plex Sans JP', monospace;">10</span>問</span>
          <span style="font-family: 'IBM Plex Mono', 'IBM Plex Sans JP', monospace; font-size: 13px; color: #B7C0CF;">0/10</span>
        </button>
        <button style="min-height: 48px; display: flex; align-items: center; gap: 12px; padding: 0; background: transparent; border: 0; color: #E8ECF3; font-family: inherit; font-size: 15px; text-align: left;">
          <span style="width: 24px; height: 24px; box-sizing: border-box; border-radius: 7px; border: 2px solid #B7C0CF; flex: none;"></span>
          <span style="flex: 1;">用語カード<span style="font-family: 'IBM Plex Mono', 'IBM Plex Sans JP', monospace;">10</span>枚</span>
          <span style="font-family: 'IBM Plex Mono', 'IBM Plex Sans JP', monospace; font-size: 13px; color: #B7C0CF;">0/10</span>
        </button>
      </div>
    </section>

    <section style="background: #1C2638; border: 1px solid #344054; border-radius: 14px; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px;">
      <div style="display: flex; justify-content: space-between; align-items: center;">
        <h2 style="margin: 0; font-size: 14px; font-weight: 700;">合格ライン到達度</h2>
        <span style="display: flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 700; color: #6FD39C; padding: 2px 8px; border: 1px solid #6FD39C; border-radius: 999px;">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg>
          到達
        </span>
      </div>
      <div style="position: relative; height: 10px; background: #344054; border-radius: 999px;">
        <div style="width: 68%; height: 100%; background: #E8ECF3; border-radius: 999px;"></div>
        <div style="position: absolute; left: 60%; top: -4px; bottom: -4px; border-left: 2px dashed #7CC4FA;"></div>
      </div>
      <div style="display: flex; justify-content: space-between; font-size: 12px; color: #B7C0CF;">
        <span>予想正答率 <span style="font-family: 'IBM Plex Mono', 'IBM Plex Sans JP', monospace; font-weight: 600; font-size: 14px; color: #E8ECF3;">68%</span></span>
        <span>目標 <span style="font-family: 'IBM Plex Mono', 'IBM Plex Sans JP', monospace; color: #7CC4FA;">60%</span>（点線）</span>
      </div>
    </section>

    <button style="margin-top: auto; min-height: 54px; border: 0; border-radius: 14px; background: #F5D547; color: #101828; font-family: inherit; font-size: 16px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px;">
      ミッションを始める
      <span style="font-size: 13px; font-weight: 400;">次：新しい問題</span>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#101828" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
    </button>
  </div>

  <nav style="display: grid; grid-template-columns: repeat(4, 1fr); border-top: 1px solid #344054; background: #1C2638; padding: 6px 4px 14px;">
    <button style="min-height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; background: transparent; border: 0; color: #F5D547; font-family: inherit; font-size: 11px; font-weight: 700;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7"></path><path d="M5 10v10h14V10"></path></svg>
      ホーム
    </button>
    <button style="min-height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; background: transparent; border: 0; color: #B7C0CF; font-family: inherit; font-size: 11px;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"></path><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"></path></svg>
      演習
    </button>
    <button style="min-height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; background: transparent; border: 0; color: #B7C0CF; font-family: inherit; font-size: 11px;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="6" width="14" height="14" rx="2"></rect><path d="M7 3h12a2 2 0 0 1 2 2v12"></path></svg>
      カード
    </button>
    <button style="min-height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; background: transparent; border: 0; color: #B7C0CF; font-family: inherit; font-size: 11px;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"></path></svg>
      分析
    </button>
  </nav>
</div>
