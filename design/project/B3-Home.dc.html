<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>B3 ホーム</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+JP:wght@400;500;700&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
a{color:#F5D547}a:hover{color:#FFE680}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; display: flex; flex-direction: column; font-family: 'IBM Plex Sans JP', 'Hiragino Sans', sans-serif; color: #E8ECF3; background: #101828;">
  <main style="flex: 1; display: flex; flex-direction: column; padding: 28px 20px 16px; gap: 16px;">
    <div style="display: flex; justify-content: space-between; align-items: center;">
      <div style="font-size: 14px; color: #B7C0CF;">基本情報ドリル</div>
      <div style="display: flex; align-items: center; gap: 6px; font-size: 14px; color: #B7C0CF;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#F5D547" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3c1 3.5 5 5.5 5 10a5 5 0 0 1-10 0c0-2.5 1.5-3.5 2-5 1 1.5 2 2 3 2-.5-2.5-.5-4.5 0-7z"></path></svg>
        連続 <span style="font-family: 'IBM Plex Mono', 'IBM Plex Sans JP', monospace; font-weight: 600; color: #E8ECF3;">7</span>日
      </div>
    </div>

    <div style="flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 10px; padding: 0 4px;">
      <div style="font-size: 15px; color: #B7C0CF;">こんばんは</div>
      <div style="font-size: 28px; font-weight: 700; line-height: 1.5;">今日やることは、<br><span style="padding: 0 4px; background: linear-gradient(transparent 55%, rgba(245,213,71,0.45) 55%);">ひとつだけ。</span></div>
    </div>

    <section style="background: #1C2638; border: 1px solid #344054; border-radius: 20px; padding: 20px; display: flex; flex-direction: column; gap: 18px;">
      <div style="display: flex; justify-content: space-between; align-items: baseline;">
        <h1 style="margin: 0; font-size: 22px; font-weight: 700;">今日の<span style="font-family: 'IBM Plex Mono', 'IBM Plex Sans JP', monospace; font-weight: 600;">15</span>分</h1>
        <div style="font-size: 14px; color: #B7C0CF;">目標 <span style="font-family: 'IBM Plex Mono', 'IBM Plex Sans JP', monospace; font-weight: 600; color: #E8ECF3;">12</span>/20問</div>
      </div>
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
        <div style="display: flex; flex-direction: column; gap: 4px; padding: 12px 14px; border-radius: 14px; background: #101828;">
          <span style="font-size: 13px; color: #B7C0CF;">期限の来た復習</span>
          <span style="font-size: 15px;"><span style="font-family: 'IBM Plex Mono', 'IBM Plex Sans JP', monospace; font-weight: 600; font-size: 28px; padding: 0 3px; background: linear-gradient(transparent 55%, rgba(245,213,71,0.45) 55%);">8</span> 問</span>
        </div>
        <div style="display: flex; flex-direction: column; gap: 4px; padding: 12px 14px; border-radius: 14px; background: #101828;">
          <span style="font-size: 13px; color: #B7C0CF;">新しい問題</span>
          <span style="font-size: 15px;"><span style="font-family: 'IBM Plex Mono', 'IBM Plex Sans JP', monospace; font-weight: 600; font-size: 28px;">8</span> 問</span>
        </div>
      </div>
      <button style="min-height: 64px; border: 0; border-radius: 16px; background: #F5D547; color: #101828; font-family: inherit; font-size: 19px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 10px;">
        始める（約<span style="font-family: 'IBM Plex Mono', 'IBM Plex Sans JP', monospace;">15</span>分）
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#101828" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
      </button>
    </section>

    <div style="display: flex; justify-content: center; align-items: baseline; gap: 6px; font-size: 14px; color: #B7C0CF;">
      試験まで <span style="font-family: 'IBM Plex Mono', 'IBM Plex Sans JP', monospace; font-weight: 600; font-size: 18px; color: #E8ECF3;">52</span>日
      <span aria-hidden="true">・</span>
      <span><span style="font-family: 'IBM Plex Mono', 'IBM Plex Sans JP', monospace;">2026</span>年<span style="font-family: 'IBM Plex Mono', 'IBM Plex Sans JP', monospace;">12</span>月<span style="font-family: 'IBM Plex Mono', 'IBM Plex Sans JP', monospace;">15</span>日</span>
    </div>

    <button aria-expanded="false" style="min-height: 48px; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; border-radius: 14px; border: 1px solid #344054; background: transparent; color: #E8ECF3; font-family: inherit; font-size: 15px;">
      <span>ほかのモード <span style="font-size: 13px; color: #B7C0CF;">分野別・模試・基数変換</span></span>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#B7C0CF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg>
    </button>
  </main>

  <nav aria-label="メイン" style="display: grid; grid-template-columns: repeat(3, 1fr); border-top: 1px solid #344054; background: #1C2638; padding: 6px 8px 16px;">
    <button aria-current="page" style="min-height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; background: transparent; border: 0; color: #F5D547; font-family: inherit; font-size: 12px; font-weight: 700;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg>
      今日
    </button>
    <button style="min-height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; background: transparent; border: 0; color: #B7C0CF; font-family: inherit; font-size: 12px;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4h4v16H4zM10 4h4v16h-4z"></path><path d="M16.5 4.5l3.5 1-4 14.5-3.5-1"></path></svg>
      ライブラリ
    </button>
    <button style="min-height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; background: transparent; border: 0; color: #B7C0CF; font-family: inherit; font-size: 12px;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"></path></svg>
      記録
    </button>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
