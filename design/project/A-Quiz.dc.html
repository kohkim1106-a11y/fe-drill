<x-dc>
<helmet>

<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; overflow: hidden; font-family: 'Zen Kaku Gothic New', 'Hiragino Sans', sans-serif; color: #1D2228; background: #F6F7F9;">
  <header style="flex-shrink: 0; display: flex; flex-direction: column; gap: 8px; padding: 6px 12px 10px; background: #FFFFFF; border-bottom: 1px solid #E3D3DA;">
    <div style="height: 44px; display: flex; align-items: center; justify-content: space-between;">
      <button style="min-width: 64px; height: 44px; display: flex; align-items: center; gap: 4px; padding: 0 8px; border: none; background: transparent; font-family: inherit; font-size: 15px; font-weight: 500; color: #5B626C; cursor: pointer;">
        <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12"></path><path d="M18 6 6 18"></path></svg>
        終了
      </button>
      <div style="font-size: 15px; font-weight: 700;">ランダム10問</div>
      <div style="min-width: 64px; text-align: right; padding-right: 8px; font-family: 'M PLUS 1 Code', monospace; font-size: 15px; font-weight: 600;">4<span style="color: #5B626C;">/10</span></div>
    </div>
    <div aria-hidden="true" style="display: grid; grid-template-columns: repeat(10, 1fr); gap: 4px; padding: 0 4px;">

      <div style="height: 6px; border-radius: 3px; background: #23794D;"></div>
      <div style="height: 6px; border-radius: 3px; background: #B8322B;"></div>

      <div style="height: 6px; border-radius: 3px; background: #E3D3DA;"></div>
      <div style="height: 6px; border-radius: 3px; background: #E3D3DA;"></div>
      <div style="height: 6px; border-radius: 3px; background: #E3D3DA;"></div>
      <div style="height: 6px; border-radius: 3px; background: #E3D3DA;"></div>
      <div style="height: 6px; border-radius: 3px; background: #E3D3DA;"></div>
    </div>
  </header>

  <main style="flex: 1; display: flex; flex-direction: column; gap: 12px; padding: 12px 16px; overflow: hidden;">
    <section style="position: relative; display: flex; flex-direction: column; gap: 12px; padding: 14px 14px 14px 28px; background: #FFFFFF; border: 1px solid #E3D3DA; border-radius: 12px;">
      <div aria-hidden="true" style="position: absolute; left: 10px; top: 16px; bottom: 16px; display: flex; flex-direction: column; justify-content: space-between;">
        <div style="width: 8px; height: 3px; background: #1D2228;"></div>
        <div style="width: 8px; height: 3px; background: #1D2228;"></div>
        <div style="width: 8px; height: 3px; background: #1D2228;"></div>
        <div style="width: 8px; height: 3px; background: #1D2228;"></div>
        <div style="width: 8px; height: 3px; background: #1D2228;"></div>
        <div style="width: 8px; height: 3px; background: #1D2228;"></div>
        <div style="width: 8px; height: 3px; background: #1D2228;"></div>
        <div style="width: 8px; height: 3px; background: #1D2228;"></div>
        <div style="width: 8px; height: 3px; background: #1D2228;"></div>
        <div style="width: 8px; height: 3px; background: #1D2228;"></div>
        <div style="width: 8px; height: 3px; background: #1D2228;"></div>
        <div style="width: 8px; height: 3px; background: #1D2228;"></div>
        <div style="width: 8px; height: 3px; background: #1D2228;"></div>
        <div style="width: 8px; height: 3px; background: #1D2228;"></div>
      </div>
      <div style="display: flex; align-items: center; gap: 8px; flex-wrap: wrap;">
        <span style="font-family: 'M PLUS 1 Code', monospace; font-size: 16px; font-weight: 600; color: #C9295F;">問4</span>
        <span style="padding: 2px 8px; border-radius: 4px; background: #FBE7EE; font-size: 12px; font-weight: 500; color: #8E1A42;">テクノロジ系</span>
        <span style="padding: 2px 8px; border-radius: 4px; border: 1px solid #E3D3DA; font-size: 12px; color: #5B626C;">キャッシュ</span>
      </div>
      <p style="margin: 0; font-size: 16px; line-height: 1.7; font-weight: 500;">キャッシュメモリのアクセス時間 <span style="font-family: 'M PLUS 1 Code', monospace;">10ns</span>、主記憶のアクセス時間 <span style="font-family: 'M PLUS 1 Code', monospace;">60ns</span>、ヒット率 <span style="font-family: 'M PLUS 1 Code', monospace;">90%</span> のとき、実効アクセス時間は何nsか。</p>
      <div style="display: flex; flex-direction: column; gap: 8px;">
        <button disabled style="min-height: 48px; display: flex; align-items: center; gap: 12px; padding: 6px 12px; border: 1.5px solid #23794D; border-radius: 10px; background: #E3F3EA; font-family: inherit; color: #1D2228; text-align: left;">
          <span style="width: 24px; height: 32px; box-sizing: border-box; border-radius: 12px; background: #23794D; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; flex-shrink: 0;">ア</span>
          <span style="flex: 1; font-family: 'M PLUS 1 Code', monospace; font-size: 17px; font-weight: 600;">15</span>
          <span style="display: flex; align-items: center; gap: 4px; font-size: 13px; font-weight: 700; color: #23794D;">
            <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8"></circle></svg>
            正解
          </span>
        </button>
        <button disabled style="min-height: 48px; display: flex; align-items: center; gap: 12px; padding: 6px 12px; border: 1px solid #E3D3DA; border-radius: 10px; background: #FFFFFF; font-family: inherit; color: #1D2228; text-align: left;">
          <span style="width: 24px; height: 32px; box-sizing: border-box; border-radius: 12px; border: 1.5px solid #C9295F; color: #C9295F; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; flex-shrink: 0;">イ</span>
          <span style="flex: 1; font-family: 'M PLUS 1 Code', monospace; font-size: 17px; font-weight: 600;">19</span>
        </button>
        <button disabled style="min-height: 48px; display: flex; align-items: center; gap: 12px; padding: 6px 12px; border: 1.5px solid #B8322B; border-radius: 10px; background: #FBE9E7; font-family: inherit; color: #1D2228; text-align: left;">
          <span style="width: 24px; height: 32px; box-sizing: border-box; border-radius: 12px; background: #B8322B; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; flex-shrink: 0;">ウ</span>
          <span style="flex: 1; font-family: 'M PLUS 1 Code', monospace; font-size: 17px; font-weight: 600;">35</span>
          <span style="display: flex; align-items: center; gap: 4px; font-size: 13px; font-weight: 700; color: #B8322B;">
            <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12"></path><path d="M18 6 6 18"></path></svg>
            あなたの解答
          </span>
        </button>
        <button disabled style="min-height: 48px; display: flex; align-items: center; gap: 12px; padding: 6px 12px; border: 1px solid #E3D3DA; border-radius: 10px; background: #FFFFFF; font-family: inherit; color: #1D2228; text-align: left;">
          <span style="width: 24px; height: 32px; box-sizing: border-box; border-radius: 12px; border: 1.5px solid #C9295F; color: #C9295F; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; flex-shrink: 0;">エ</span>
          <span style="flex: 1; font-family: 'M PLUS 1 Code', monospace; font-size: 17px; font-weight: 600;">55</span>
        </button>
      </div>
    </section>

    <section style="display: flex; flex-direction: column; gap: 8px; padding: 14px 16px; background: #FFFFFF; border: 1px solid #E3D3DA; border-radius: 12px;">
      <div style="display: flex; align-items: center; gap: 8px; font-size: 17px; font-weight: 700; color: #B8322B;">
        <span>× 不正解</span>
        <span style="font-size: 15px; color: #1D2228;">正解はア</span>
      </div>
      <div style="display: flex; flex-direction: column; gap: 4px;">
        <div style="font-size: 13px; font-weight: 700; color: #5B626C;">解説</div>
        <div style="font-size: 14px; line-height: 1.6;">ヒット時はキャッシュ、ミス時は主記憶にアクセスするので、時間を確率で重み付けして足します。</div>
        <div style="padding: 8px 10px; border-radius: 6px; background: #F6F7F9; font-family: 'M PLUS 1 Code', monospace; font-size: 15px; font-weight: 600;">0.9×10 + 0.1×60 = 9 + 6 = 15ns</div>
      </div>
      <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px;">
        <span style="font-size: 12px; color: #5B626C;">出典：オリジナル問題</span>
        <button style="min-height: 44px; display: flex; align-items: center; gap: 4px; padding: 0 8px; border: none; background: transparent; font-family: inherit; font-size: 13px; color: #5B626C; cursor: pointer;">
          <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 21V4"></path><path d="M5 4h11l-2 4 2 4H5"></path></svg>
          誤りを報告
        </button>
      </div>
    </section>
  </main>

  <footer style="flex-shrink: 0; padding: 10px 16px 20px; background: #FFFFFF; border-top: 1px solid #E3D3DA;">
    <button style="width: 100%; height: 54px; border: none; border-radius: 27px; background: #C9295F; color: #FFFFFF; font-family: inherit; font-size: 17px; font-weight: 700; cursor: pointer;">次の問題 →</button>
  </footer>
</div>
